# Labels are the source of truth; this workflow only projects them. Never write labels from here.
name: project-sync

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  PROJECT_ID: PVT_kwHOBREXm84Bow7L
  STATUS_FIELD_ID: PVTSSF_lAHOBREXm84Bow7LzhnPeUI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Project issue Status from labels and state
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          sync_issue() {
            local number="$1" json node state reason labels item option

            json=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number")
            node=$(jq -r '.node_id' <<<"$json")

            # Closed state wins over labels; within the open labels, first match wins.
            state=$(jq -r '.state' <<<"$json")
            reason=$(jq -r '.state_reason // ""' <<<"$json")
            if [ "$state" = "closed" ]; then
              if [ "$reason" = "not_planned" ]; then option=4f9df6bb; else option=1787b6c2; fi
            else
              labels=$(jq -r '.labels[].name' <<<"$json")
              if grep -qx blocked <<<"$labels"; then option=700cbe14
              elif grep -qx in-review <<<"$labels"; then option=3f713bdc
              elif grep -qx in-progress <<<"$labels"; then option=974affa4
              elif grep -qx ready-for-agent <<<"$labels"; then option=931b92fc
              else option=917aa3fd
              fi
            fi

            # Returns the existing item when the issue is already on the board.
            item=$(gh api graphql \
              -f query='mutation($project:ID!,$content:ID!){addProjectV2ItemById(input:{projectId:$project,contentId:$content}){item{id}}}' \
              -f project="$PROJECT_ID" -f content="$node" \
              --jq '.data.addProjectV2ItemById.item.id')

            gh api graphql \
              -f query='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}' \
              -f project="$PROJECT_ID" -f item="$item" -f field="$STATUS_FIELD_ID" -f option="$option" >/dev/null

            echo "#$number -> Status $option"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 300 --json number --jq '.[].number' |
              while read -r number; do sync_issue "$number"; done
          else
            sync_issue "$ISSUE_NUMBER"
          fi
